<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BH Picture Scraper - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 {
      font-size: 20px;
      color: #1a73e8;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 24px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1557b0;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #2e7d32;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>BH Picture Scraper Settings</h1>

  <label for="parentDir">Parent directory</label>
  <input type="text" id="parentDir" placeholder="BrightHorizons">
  <div class="hint">Relative to your Downloads folder. Images will be saved to Downloads/&lt;this&gt;/YYYY-MM-DD/</div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
